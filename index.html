<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎆 Fireworks — Diwali 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Rozha+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Hidden Video Element for MediaPipe Input -->
      <video id="webcam" playsinline muted autoplay></video>

      <!-- Main Compositing & Pyrotechnic Canvas -->
      <canvas id="stage"></canvas>

      <!-- Night Sky Atmospheric Vignette -->
      <div class="vignette-overlay"></div>

      <!-- Grand Finale Centerpiece: Shows "HAPPY DIWALI" in center after Grand Finale -->
      <div id="grand-finale-center" class="grand-finale-center hidden">
        <div class="finale-sparkle-aura"></div>
        <div class="finale-mandala-ring"></div>
        
        <!-- Marigold Garland Arch -->
        <div class="marigold-garland">
          <img src="/images/marigold.svg" class="garland-flower f1" alt="Marigold" />
          <img src="/images/marigold.svg" class="garland-flower f2" alt="Marigold" />
          <img src="/images/marigold.svg" class="garland-flower f3" alt="Marigold" />
          <img src="/images/marigold.svg" class="garland-flower f4" alt="Marigold" />
          <img src="/images/marigold.svg" class="garland-flower f5" alt="Marigold" />
        </div>

        <div class="finale-banner">
          <img src="/images/diya.svg" class="banner-diya left" alt="Diwali Diya" />
          <div class="finale-text-group">
            <span class="finale-pretitle">✦ SHUBH DEEPAVALI ✦</span>
            <h1 class="finale-heading">HAPPY DIWALI</h1>
            <p class="finale-subheading">May your world blaze with light, joy & prosperity</p>
          </div>
          <img src="/images/diya.svg" class="banner-diya right" alt="Diwali Diya" />
        </div>
      </div>

      <!-- HUD (toggled with H) -->
      <div id="hud" class="hud-container">
        <header class="hud-header">
          <div class="brand">
            <span class="brand-name">Fireworks</span>
            <span class="brand-sub">Diwali 2026</span>
          </div>

          <div class="header-actions">
            <button id="btn-audio" class="icon-btn" title="Sound (M)" aria-label="Toggle sound">
              <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
              <svg class="icon icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
            </button>
            <button id="btn-record" class="record-btn" title="Record (R)" aria-label="Record video">
              <span class="record-dot"></span>
              <span id="record-label" class="btn-label">Record</span>
              <span id="record-timer" class="record-timer">00:00</span>
            </button>
          </div>
        </header>

        <footer class="hud-footer">
          <ul class="gesture-bar" aria-label="Gestures">
            <li class="gesture" data-gesture="ROCKET"><span class="gesture-glyph">☝️</span><span class="gesture-name">Rocket</span><span class="gesture-sub">Point up</span></li>
            <li class="gesture" data-gesture="ANAR"><span class="gesture-glyph">✊</span><span class="gesture-name">Anar</span><span class="gesture-sub">Fist</span></li>
            <li class="gesture" data-gesture="STARBURST"><span class="gesture-glyph">✋</span><span class="gesture-name">Starburst</span><span class="gesture-sub">Open palm</span></li>
            <li class="gesture" data-gesture="ROMAN_CANDLE"><span class="gesture-glyph">✌️</span><span class="gesture-name">Roman Candle</span><span class="gesture-sub">Peace</span></li>
            <li class="gesture" data-gesture="PHOOLJHADI"><span class="gesture-glyph">👌</span><span class="gesture-name">Phooljhadi</span><span class="gesture-sub">Pinch</span></li>
            <li class="gesture" data-gesture="GRAND_FINALE"><span class="gesture-glyph">🙏</span><span class="gesture-name">Finale</span><span class="gesture-sub">Namaste</span></li>
          </ul>
        </footer>
      </div>

      <!-- Shown when HUD is hidden with H -->
      <button id="btn-restore-hud" class="restore-hud-btn hidden" title="Show controls (H)">Show controls</button>

      <!-- Recorded reel preview -->
      <aside id="reel-preview-card" class="reel-preview hidden" aria-label="Recorded Diwali Reel">
        <button type="button" id="reel-preview-thumb-btn" class="reel-thumb-btn" aria-label="Open full reel preview">
          <video id="reel-preview-video" playsinline loop muted autoplay></video>
          <div class="reel-play-overlay"><span>View</span></div>
        </button>
        <div class="reel-card-meta">
          <span id="reel-duration" class="reel-duration">00:00</span>
        </div>
        <div class="reel-actions">
          <button type="button" id="reel-view-btn" class="hud-btn hud-btn-label" aria-label="View reel">View</button>
          <button type="button" id="reel-save-btn" class="hud-btn hud-btn-label btn-save" aria-label="Download video">Download</button>
          <button type="button" id="reel-dismiss-btn" class="hud-btn hud-btn-label btn-dismiss" aria-label="Dismiss">Dismiss</button>
        </div>
      </aside>

      <!-- Full reel dialog -->
      <dialog id="reel-dialog" class="reel-dialog" aria-label="Diwali Reel Player">
        <div class="reel-dialog-card">
          <div class="reel-dialog-header">
            <div class="reel-dialog-title">
              <span>Your reel</span>
            </div>
            <button type="button" id="reel-dialog-close-btn" class="reel-dialog-close" aria-label="Close dialog">&times;</button>
          </div>
          <div class="reel-dialog-video-wrapper">
            <video id="reel-dialog-video" controls playsinline loop></video>
          </div>
          <div class="reel-dialog-footer">
            <button type="button" id="reel-dialog-save-btn" class="hud-btn hud-btn-download">Download</button>
          </div>
        </div>
      </dialog>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
